spring.application.name=kanagat-beken-student-api
server.port=8080
# Personalized application URL: http://localhost:8080/kanagat-beken/api/students
server.servlet.context-path=/kanagat-beken

app.student-name=${STUDENT_NAME:Kanagat Beken}

# In Docker Compose these come from environment variables (host = service name "postgres")
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/studentdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
